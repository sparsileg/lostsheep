[package]
name = "lost-sheep"
version = "0.1.0"
edition = "2021"
description = "Lost Sheep — congregational visit-tracking desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Sidecar execution — bundles a self-contained pdftotext (poppler-utils)
# binary per platform so PDF import doesn't depend on a separately
# installed poppler on the end user's machine. See pdf_parser.rs.
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLCipher-backed SQLite. "bundled-sqlcipher" builds SQLCipher itself so
# we don't depend on a system OpenSSL/SQLCipher install on the target OS.
rusqlite = { version = "0.31", features = ["bundled-sqlcipher", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = { version = "0.24", features = ["bundled-sqlcipher"] }

# OS keychain access (macOS Keychain / Windows Credential Manager / Linux
# Secret Service via libsecret).
keyring = "2"

# Backup passphrase -> encryption key derivation.
argon2 = "0.5"
rand = "0.8"

# Single-file backup archive (db + salt bundled together). Default
# features off — we only ever write Stored (uncompressed) entries, since
# the DB is SQLCipher-encrypted and already looks like random bytes, so
# there's nothing to gain from pulling in a compression codec.
zip = { version = "0.6", default-features = false }

# PDF text extraction for the import parser.
regex = "1"

# Road graph ingestion (issue #7) — parses a pre-filtered roads-only
# .pbf produced by an external script; see commands/roads.rs.
osmpbf = "0.3"

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
log = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]
