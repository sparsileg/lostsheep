<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lost Sheep</title>
<link id="themeLink" rel="stylesheet" href="css/themes/nordic.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/import-view.css" />
<link rel="stylesheet" href="css/review-view.css" />
<link rel="stylesheet" href="css/households-view.css" />
<link rel="stylesheet" href="css/map-view.css" />
<link rel="stylesheet" href="css/settings-modal.css" />
<link rel="stylesheet" href="css/log-viewer.css" />
<link rel="stylesheet" href="css/backup-restore.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
</head>
<body>
<div id="appShell">
  <div class="mobile-topbar">
    <button id="mobile-menu-btn" class="btn">☰</button>
    <span class="logo">Lost Sheep</span>
  </div>

  <nav id="sidebar">
    <div class="sidebar-top">
      <div class="logo">🐑 Lost Sheep</div>
      <button id="hamburger-btn" title="Menu">☰</button>
    </div>
    <div class="sidebar-controls">
      <div id="theme-dropdown">
        <button id="theme-dropdown-trigger" class="btn">Theme: <span id="theme-dropdown-label">Nordic</span></button>
        <div id="theme-dropdown-menu">
          <div class="theme-dropdown-item" data-theme="css/themes/nordic.css">Nordic</div>
          <div class="theme-dropdown-item" data-theme="css/themes/dark.css">Dark</div>
          <div class="theme-dropdown-item" data-theme="css/themes/light.css">Light</div>
          <div class="theme-dropdown-item" data-theme="css/themes/matrix.css">Matrix</div>
          <div class="theme-dropdown-item" data-theme="css/themes/flat.css">Flat</div>
        </div>
      </div>
      <div class="font-size-control">
        <button id="font-size-down" class="btn">A-</button>
        <span id="font-size-label">Size: 16</span>
        <button id="font-size-up" class="btn">A+</button>
      </div>
    </div>
    <ul id="sidebarNavList"></ul>
    <div class="sidebar-footer">
      <div id="sidebarVersionFooter" style="font-size:0.75em;opacity:.6;"></div>
    </div>
  </nav>

  <div id="hamburgerMenu" class="hamburger-menu">
    <div class="hamburger-menu-item" data-action="settings">Settings</div>
    <div class="hamburger-menu-item" data-action="backup">Backup</div>
    <div class="hamburger-menu-item" data-action="restore">Restore</div>
    <div class="hamburger-menu-item" data-action="logs">Log Viewer</div>
    <div class="hamburger-menu-item" data-action="help">Help</div>
  </div>

  <main id="mainContent">
    <div id="messageArea"></div>

    <section id="view-import" class="view"><div id="importRoot"></div></section>
    <section id="view-review" class="view"><div id="reviewRoot"></div></section>
    <section id="view-households" class="view"><div id="householdsRoot"></div></section>
    <section id="view-map" class="view active"><div id="mapViewRoot"></div></section>
    <section id="view-logs" class="view"><div id="logsRoot"></div></section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="js/api.js"></script>
<script src="js/dropdown.js"></script>
<script src="js/core.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/tag-chip-input.js"></script>
<script src="js/views/import-view.js"></script>
<script src="js/views/review-view.js"></script>
<script src="js/views/map-view.js"></script>
<script src="js/views/settings-modal.js"></script>
<script src="js/views/log-viewer.js"></script>
<script src="js/views/backup-restore.js"></script>
<script src="js/views/households-view.js"></script>
<script>window.onload = () => Core.init();</script>
</body>
</html>
